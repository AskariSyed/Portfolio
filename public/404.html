<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Muhammad Hassan Askari</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        background: #09090b;
        color: #e4e4e7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        text-align: center;
        max-width: 480px;
      }
      .code {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
        font-size: 7rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #f4f4f5;
        margin-bottom: 0.75rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.4rem;
        border-radius: 0.6rem;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
      }
      .primary {
        background: #3b82f6;
        color: #fff;
      }
      .primary:hover { background: #2563eb; }
      .secondary {
        background: transparent;
        color: #a1a1aa;
        border: 1px solid #3f3f46;
      }
      .secondary:hover { color: #f4f4f5; border-color: #71717a; }
      .dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #3b82f6;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1><span class="dot"></span>Page Not Found</h1>
      <p>
        This page doesn't exist or has been moved.<br />
        Head back to the portfolio to explore my work, experience, and projects.
      </p>
      <div class="actions">
        <a href="/" class="primary">← Back to Portfolio</a>
        <a href="/#contact" class="secondary">Get in Touch</a>
      </div>
    </div>
    <script>
      // Auto-redirect to home after 8 seconds
      setTimeout(() => { window.location.href = '/'; }, 8000);
    </script>
  </body>
</html>
